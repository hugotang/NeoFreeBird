name: Build Tweak

on:
  workflow_dispatch:
    inputs:
      deploy_format:
        description: "Deployment format"
        default: sideloaded
        required: true
        type: choice
        options:
          - rootful
          - sideloaded
          - trollstore
          - rootless
      decrypted_ipa_url:
        description: "Base IPA URL (must be decrypted, required for sideloaded/trollstore)"
        default: ""
        required: false
        type: string
      rebrand:
        description: "Rebrand from the patina config in the repo (IPA builds only)"
        default: true
        required: false
        type: boolean
      sdk_version:
        description: "iOS SDK Version"
        default: "16.5"
        required: true
        type: string
      target_version:
        description: "Target iOS Version"
        default: "14.0"
        required: true
        type: string
      commit_id:
        description: "Commit ID to build at"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tweak
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ inputs.commit_id || github.ref }}

      - name: Checkout Tweak Submodules
        run: git -C main submodule update --init --recursive

      - name: Setup Theos
        uses: ./main/.github/actions/setup-theos
        with:
          sdk-version: ${{ inputs.sdk_version }}

      # A dispatch input can't be conditionally required, so it is checked here.
      - name: Download base IPA
        if: inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore'
        run: |
          if [[ -z "$IPA_URL" ]]; then
            echo "::error::A ${{ inputs.deploy_format }} build needs a base IPA URL."
            exit 1
          fi
          wget "$IPA_URL" --no-verbose -O main/packages/base.ipa
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}

      - name: Compute ffmpeg Cache Key
        id: ffmpeg-key
        run: |
          echo "key=ffmpeg-stack-linux-sdk${{ inputs.sdk_version }}-$(git -C main rev-parse --short HEAD:deps/ffmpeg-kit-next/upstream)-${{ hashFiles('main/deps/ffmpeg-kit-next/build-ffmpeg.py') }}" >> "$GITHUB_OUTPUT"

      - name: ffmpeg Stack Caching
        uses: actions/cache@v6
        with:
          path: |
            ffmpeg-build
            main/deps/ffmpeg-kit-next/build
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - name: Build Package
        id: build
        run: |
          cd ${{ github.workspace }}/main
          FLAGS=()
          if [[ "$REBRAND" == "true" ]]; then FLAGS+=(--rebrand); fi
          ./build.py --release --${{ inputs.deploy_format }} "${FLAGS[@]}"
        env:
          REBRAND: ${{ (inputs.deploy_format == 'sideloaded' || inputs.deploy_format == 'trollstore') && inputs.rebrand }}
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build
          TWEAK_SDK_VERSION: ${{ inputs.sdk_version }}
          TWEAK_TARGET_VERSION: ${{ inputs.target_version }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.package }}
          path: ${{ github.workspace }}/main/packages/${{ steps.build.outputs.package }}
          archive: false
          retention-days: 1
          if-no-files-found: error
