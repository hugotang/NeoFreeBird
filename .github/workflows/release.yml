name: Release

on:
  workflow_dispatch:
    inputs:
      decrypted_ipa_url:
        description: "Base IPA URL (must be decrypted, required for sideloaded/trollstore)"
        default: ""
        required: true
        type: string
      sdk_version:
        description: "iOS SDK Version"
        default: "16.5"
        required: true
        type: string
      target_version:
        description: "Target iOS Version"
        default: "14.0"
        required: true
        type: string
      commit_id:
        description: "Commit ID to build at"
        default: ""
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every format comes out of one job: the four builds share a checkout, a
  # toolchain and the base IPA, and repackaging an already compiled tweak is
  # quick enough that splitting them would cost more in setup than it saves.
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6
        with:
          path: main
          ref: ${{ inputs.commit_id || github.ref }}

      - name: Checkout Tweak Submodules
        run: git -C main submodule update --init --recursive

      - name: Setup Theos
        uses: ./main/.github/actions/setup-theos
        with:
          sdk-version: ${{ inputs.sdk_version }}

      - name: Compute ffmpeg Cache Key
        id: ffmpeg-key
        run: |
          echo "key=ffmpeg-stack-linux-sdk${{ inputs.sdk_version }}-$(git -C main rev-parse --short HEAD:deps/ffmpeg-kit-next/upstream)-${{ hashFiles('main/deps/ffmpeg-kit-next/build-ffmpeg.py') }}" >> "$GITHUB_OUTPUT"

      # build.py builds the stack itself when this restores nothing.
      - name: ffmpeg Stack Caching
        uses: actions/cache@v6
        with:
          path: |
            ffmpeg-build
            main/deps/ffmpeg-kit-next/build
          key: ${{ steps.ffmpeg-key.outputs.key }}

      - name: Download Base IPA
        run: wget "$IPA_URL" --no-verbose -O main/packages/base.ipa
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}

      - name: Build Stock Packages
        id: build
        run: |
          cd ${{ github.workspace }}/main
          ./build.py --release --rootless --rootful --sideloaded --trollstore
        env:
          THEOS: ${{ github.workspace }}/theos
          BUILD_DIR: ${{ github.workspace }}/ffmpeg-build
          TWEAK_SDK_VERSION: ${{ inputs.sdk_version }}
          TWEAK_TARGET_VERSION: ${{ inputs.target_version }}

      - name: Build Rebranded IPAs
        run: |
          cd ${{ github.workspace }}/main
          ./build.py --release --sideloaded --trollstore --package-only --rebrand

      - name: Collect Packages
        run: |
          mkdir -p out
          mv main/packages/${{ steps.build.outputs.name }}-* out/

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: v${{ steps.build.outputs.version }} - ${{ steps.build.outputs.name }}
          files: out/*
          draft: true
